{% extends "blog/base.html" %}

{% block title %}Delete Task{% endblock %}

{% block content %}
    <h2>Delete "{{ task.title }}"?</h2>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete it</button>
    </form>
    <a href="{% url 'todo:task_list' %}">Cancel</a>
{% endblock %}
